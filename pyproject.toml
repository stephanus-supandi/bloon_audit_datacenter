[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bloon-audit-datacenter"
version = "0.1.1"
description = "Evidence-based preliminary screening for data-center project documentation"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
